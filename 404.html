<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0b0a09">
<title>Page introuvable</title>
<style>
  :root { --fond: #0b0a09; --ivoire: #efe8da; --or: #cfae72; }
  html { background: var(--fond); color: var(--ivoire); font: 300 19px/1.5 "Cormorant Garamond", Georgia, serif; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; text-align: center; }
  h1 { margin: 0 0 10px; font-weight: 300; font-size: clamp(32px, 8vw, 46px); }
  p { margin: 0 0 26px; font-style: italic; color: #b8b0a2; }
  a { display: inline-block; padding: 12px 22px; border: 1px solid rgba(207, 174, 114, .45); border-radius: 999px;
      font: 400 11px sans-serif; letter-spacing: .26em; text-transform: uppercase; color: var(--or); text-decoration: none; }
</style>
</head>
<body>
<main>
  <h1>Cette porte n’existe pas</h1>
  <p>L’adresse est peut-être incomplète.</p>
  <a href="/univers-olfactif/">Retourner à l’accueil</a>
</main>
</body>
</html>
